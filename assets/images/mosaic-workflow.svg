<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">The MOSAIC research loop</title>
  <desc id="desc">Observations and high-resolution simulations feed an agentic discovery system. Candidate equations pass physical checks, are implemented in JAX-GCM, calibrated and evaluated, and the results guide the next discovery cycle and future observations.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f2b"/>
      <stop offset="0.55" stop-color="#0b3b45"/>
      <stop offset="1" stop-color="#15505a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52d6c7"/>
      <stop offset="1" stop-color="#b5e46c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#031116" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#86ddd0"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#aac2c4"/>
    </marker>
  </defs>

  <rect width="1200" height="680" rx="26" fill="url(#background)"/>
  <circle cx="1085" cy="85" r="155" fill="#3db9ad" opacity="0.08"/>
  <circle cx="110" cy="620" r="190" fill="#b5e46c" opacity="0.06"/>

  <text x="60" y="66" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">From observations to interpretable climate physics</text>
  <text x="60" y="99" fill="#b8d3d5" font-family="Arial, Helvetica, sans-serif" font-size="17">MOSAIC connects scientific reasoning, differentiable simulation, and real-world evaluation in a continuous loop.</text>

  <!-- Input card -->
  <g filter="url(#shadow)">
    <rect x="55" y="162" width="220" height="302" rx="18" fill="#ffffff"/>
  </g>
  <rect x="55" y="162" width="220" height="8" rx="4" fill="#58d3c5"/>
  <circle cx="91" cy="209" r="18" fill="#e5f8f5"/>
  <path d="M81 212 C86 199, 96 199, 101 212 M79 216 H104" fill="none" stroke="#138b83" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="216" fill="#0b3540" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Evidence</text>
  <text x="82" y="262" fill="#345761" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Observations</text>
  <text x="82" y="289" fill="#647d83" font-family="Arial, Helvetica, sans-serif" font-size="14">MODIS · ARM · ERA5</text>
  <text x="82" y="312" fill="#647d83" font-family="Arial, Helvetica, sans-serif" font-size="14">LASSO · in-situ data</text>
  <line x1="82" y1="340" x2="248" y2="340" stroke="#dbe8e9"/>
  <text x="82" y="375" fill="#345761" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Fine-scale simulation</text>
  <text x="82" y="402" fill="#647d83" font-family="Arial, Helvetica, sans-serif" font-size="14">ClimSim and process-level</text>
  <text x="82" y="425" fill="#647d83" font-family="Arial, Helvetica, sans-serif" font-size="14">training cases</text>

  <!-- Discovery card -->
  <g filter="url(#shadow)">
    <rect x="345" y="162" width="220" height="302" rx="18" fill="#ffffff"/>
  </g>
  <rect x="345" y="162" width="220" height="8" rx="4" fill="#65cab2"/>
  <circle cx="381" cy="209" r="18" fill="#e8f7ef"/>
  <path d="M373 209 H389 M381 201 V217 M375 203 L387 215 M387 203 L375 215" stroke="#16886e" stroke-width="2.5" stroke-linecap="round"/>
  <text x="410" y="216" fill="#0b3540" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Discover</text>
  <text x="372" y="262" fill="#345761" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Agentic reasoning</text>
  <text x="372" y="289" fill="#647d83" font-family="Arial, Helvetica, sans-serif" font-size="14">Hypotheses and variables</text>
  <line x1="372" y1="318" x2="538" y2="318" stroke="#dbe8e9"/>
  <text x="372" y="352" fill="#345761" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Symbolic regression</text>
  <text x="372" y="379" fill="#647d83" font-family="Arial, Helvetica, sans-serif" font-size="14">Interpretable equations</text>
  <line x1="372" y1="408" x2="538" y2="408" stroke="#dbe8e9"/>
  <text x="372" y="438" fill="#16886e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">PHYSICAL CONSTRAINTS</text>

  <!-- Integrate card -->
  <g filter="url(#shadow)">
    <rect x="635" y="162" width="220" height="302" rx="18" fill="#ffffff"/>
  </g>
  <rect x="635" y="162" width="220" height="8" rx="4" fill="#8bd38f"/>
  <circle cx="671" cy="209" r="18" fill="#eef8e7"/>
  <path d="M661 205 H681 M661 213 H681 M667 199 V219 M675 199 V219" stroke="#548e35" stroke-width="2" stroke-linecap="round"/>
  <text x="700" y="216" fill="#0b3540" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Integrate</text>
  <text x="662" y="262" fill="#345761" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Differentiable JAX</text>
  <text x="662" y="289" fill="#647d83" font-family="Arial, Helvetica, sans-serif" font-size="14">Modular implementations</text>
  <line x1="662" y1="318" x2="828" y2="318" stroke="#dbe8e9"/>
  <text x="662" y="352" fill="#345761" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">JAX-GCM rollouts</text>
  <text x="662" y="379" fill="#647d83" font-family="Arial, Helvetica, sans-serif" font-size="14">Gradient-based tuning</text>
  <line x1="662" y1="408" x2="828" y2="408" stroke="#dbe8e9"/>
  <text x="662" y="438" fill="#548e35" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">GLOBAL MODEL TEST</text>

  <!-- Evaluation card -->
  <g filter="url(#shadow)">
    <rect x="925" y="162" width="220" height="302" rx="18" fill="#ffffff"/>
  </g>
  <rect x="925" y="162" width="220" height="8" rx="4" fill="#b4df70"/>
  <circle cx="961" cy="209" r="18" fill="#f4f9e8"/>
  <path d="M952 212 L958 218 L971 201" fill="none" stroke="#638d2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="990" y="216" fill="#0b3540" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Evaluate</text>
  <text x="952" y="262" fill="#345761" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Withheld data</text>
  <text x="952" y="289" fill="#647d83" font-family="Arial, Helvetica, sans-serif" font-size="14">Observational accuracy</text>
  <line x1="952" y1="318" x2="1118" y2="318" stroke="#dbe8e9"/>
  <text x="952" y="352" fill="#345761" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Long simulations</text>
  <text x="952" y="379" fill="#647d83" font-family="Arial, Helvetica, sans-serif" font-size="14">Stability and robustness</text>
  <line x1="952" y1="408" x2="1118" y2="408" stroke="#dbe8e9"/>
  <text x="952" y="438" fill="#638d2b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">BENCHMARK SKILL</text>

  <!-- Main arrows -->
  <path d="M278 313 H333" fill="none" stroke="#86ddd0" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M568 313 H623" fill="none" stroke="#86ddd0" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M858 313 H913" fill="none" stroke="#86ddd0" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Feedback loop -->
  <path d="M1035 480 V525 Q1035 552 1008 552 H458 Q431 552 431 525 V478" fill="none" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="590" y="526" width="302" height="52" rx="26" fill="#103a43" stroke="#67d6c2" stroke-width="1.5"/>
  <text x="741" y="558" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Results guide the next experiment</text>

  <!-- Future observation branch -->
  <path d="M1035 480 V620 H277" fill="none" stroke="#aac2c4" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow-muted)"/>
  <text x="655" y="647" text-anchor="middle" fill="#b8d3d5" font-family="Arial, Helvetica, sans-serif" font-size="14">Longer horizon: uncertainty gradients identify high-value future observations</text>
</svg>
