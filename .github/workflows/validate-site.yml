name: Validate Jekyll site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check projects share one grid
        run: python3 .github/scripts/check_project_listing.py
      - name: Save rendered site for inspection
        uses: actions/upload-artifact@v4
        with:
          name: rendered-site
          path: _site/
